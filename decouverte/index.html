<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les gangsters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page-titre" class="page">
    <h1>Les gangsters</h1>
    <button id="bouton">Surprise</button>
    <p id="message"></p>
    <button id="play">Play</button>
  </div>

  <div id="accueil" class="page cache">
    <h1>Mini jeu</h1>
    <h2>Bienvenue !</h2>
    <button id="start">Start</button>
  </div>

  <div id="partie" class="page cache">
    <canvas id="jeu" width="800" height="300"></canvas>
    <p id="etat">Évite les obstacles !</p>
    <div>
      <button id="sauter">Sauter</button>
      <button id="glisser">Glisser</button>
      <button id="rejouer">Rejouer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
